<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wall mapping</title>
    <style>
      html, body { margin: 0; background: #000; overflow: hidden; cursor: none; }
      canvas { display: block; width: 100vw; height: 100vh; }
      /* kept rendered (not display:none) so requestVideoFrameCallback keeps firing */
      video { position: fixed; width: 1px; height: 1px; opacity: 0; }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <video muted playsinline></video>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
